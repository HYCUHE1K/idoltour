 [project]
 name = "movie-agent"
 version = "0.1.0"
 description = "Scrapy-driven agent that retrieves top 3 movie matches."
 authors = [
   { name = "Movie Agent Maintainers" }
 ]
 readme = "README.md"
 requires-python = ">=3.10"
 dependencies = [
   "scrapy>=2.11",
   "rapidfuzz>=3.9",
 ]

 [project.scripts]
 movie-agent = "movie_agent.cli:main"

 [build-system]
 requires = ["setuptools>=67", "wheel"]
 build-backend = "setuptools.build_meta"
